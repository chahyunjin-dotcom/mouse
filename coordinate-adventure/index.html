<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>좌표 탐험대! 보물을 찾아라</title><style>body{font-family:system-ui,sans-serif;background:#f2f8ff;color:#253451;text-align:center;margin:0;padding:20px}main{max-width:650px;margin:auto;background:white;border-radius:24px;padding:22px;box-shadow:0 8px 28px #a9bed455}h1{font-size:clamp(24px,5vw,34px)}button,select{font:inherit;border-radius:12px;padding:12px;border:2px solid #b7c9df;background:white;cursor:pointer}button:hover{background:#e1f0ff}button:focus-visible{outline:3px solid orange}.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.tabs button{background:#d9e9ff}.tabs button.active,.primary{background:#316ad8;color:white}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:420px;margin:20px auto}.cell{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;background:#dcefdc;font-size:clamp(20px,6vw,38px);position:relative}.cell:nth-child(even){background:#eaf3d7}.cell small{position:absolute;bottom:2px;right:5px;font-size:10px;color:#52614d}.obstacle{background:#ffc9ba!important}.controls{display:grid;grid-template-columns:repeat(3,90px);gap:8px;justify-content:center}.controls button{font-size:20px}.commands{min-height:48px;background:#f2f6ff;border-radius:12px;padding:10px;margin:12px 0;overflow-wrap:anywhere}.info{font-weight:bold;min-height:28px}section{margin-top:16px}#coord{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap}footer{font-size:13px;color:#5d6b7c;margin-top:25px}
/* 기존 게임 원본 복구 + 버튼만 게임판 오른쪽에 배치 */
*{box-sizing:border-box}body{padding:12px}main{max-width:880px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 245px;column-gap:16px;row-gap:7px;align-items:start}main>h1,main>nav,main>h2,main>p:nth-of-type(1),main>p:nth-of-type(2),main>div:nth-of-type(1),main>footer{grid-column:1/-1;margin:0}main>h1{font-size:clamp(23px,3vw,30px)}main>h2{font-size:20px}main>p{margin:0}main>.board{grid-column:1;grid-row:7/span 3;width:min(100%,min(56vh,440px));margin:0 auto}main>#relative,main>#absolute,main>#maze{grid-column:2;grid-row:7;margin:0;align-self:start}main>#message{grid-column:2;grid-row:8;margin:0;align-self:start}main>p:nth-last-of-type(1){grid-column:2;grid-row:9;margin:0;display:flex;flex-wrap:wrap;gap:6px}main>footer{grid-row:10;margin-top:4px}.controls{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.controls button{padding:9px 3px}.commands{margin:6px 0;padding:7px}#maze>div:first-of-type{display:grid;grid-template-columns:1fr 1fr;gap:5px}#maze button{padding:7px 4px}#coord{display:flex;flex-direction:column;gap:8px}#coord label{display:flex;justify-content:space-between;align-items:center;gap:6px}#coord select{min-width:90px}[hidden]{display:none!important}
@media(max-width:620px){main{grid-template-columns:minmax(0,1fr) 145px;gap:5px;padding:9px}main>.board{width:min(100%,55vh)}main>h1{font-size:21px}main>h2{font-size:17px}main>p{font-size:13px}main>#relative button,main>#absolute button,main>#maze button{font-size:12px;padding:5px 2px}main>#maze>p{font-size:11px}main>#maze>div:first-of-type{gap:3px}main>footer{font-size:11px}#coord select{min-width:50px}}
</style></head><body><main><h1>🐰 좌표 탐험대! 보물을 찾아라</h1><p>로그인 없이 즐기는 초등 저학년 좌표 게임</p><nav class="tabs"><button onclick="stage(1)" id="tab1">1단계 방향키</button><button onclick="stage(2)" id="tab2">2단계 좌표</button><button onclick="stage(3)" id="tab3">3단계 미로</button></nav><h2 id="heading"></h2><p id="help"></p><div>⭐ 점수 <b id="score">0</b>점 · 현재 위치 <b id="position"></b></div><div id="board" class="board" aria-label="좌표 게임판"></div><p id="message" class="info" role="status"></p><section id="relative"><div class="controls"><span></span><button onclick="move(0,1)">⬆️</button><span></span><button onclick="move(-1,0)">⬅️</button><button onclick="reset()">🔄</button><button onclick="move(1,0)">➡️</button><span></span><button onclick="move(0,-1)">⬇️</button><span></span></div></section><section id="absolute" hidden><div id="coord"><label>X <select id="x"></select></label><label>Y <select id="y"></select></label><button class="primary" onclick="teleport()">좌표로 이동!</button></div></section><section id="maze" hidden><p>명령을 차례대로 담고 실행해요. 🧱 장애물은 피하세요!</p><div><button onclick="add(0,1)">⬆️ 위</button><button onclick="add(0,-1)">⬇️ 아래</button><button onclick="add(-1,0)">⬅️ 왼쪽</button><button onclick="add(1,0)">➡️ 오른쪽</button></div><div id="commands" class="commands">명령을 선택하세요</div><button class="primary" onclick="run()">▶️ 명령 실행</button> <button onclick="undo()">↩️ 하나 취소</button> <button onclick="clearCommands()">🗑️ 모두 지우기</button></section><p><button onclick="next()">🎁 다음 보물</button> <button onclick="reset()">다시 시작</button></p><footer>절대좌표: 정해진 위치 (X,Y) · 상대좌표: 지금 위치에서 움직이는 칸 수<br>엔트리 코딩 수업 전 좌표 연습용</footer></main><script>let level=1,round=0,score=0,pos={x:0,y:0},goal={x:4,y:4},walls=[],commands=[],running=false;const $=id=>document.getElementById(id);for(let i=0;i<5;i++){for(let id of ['x','y'])$(id).add(new Option(i,i))}function key(p){return p.x+','+p.y}function stage(n){level=n;round=0;score=0;$('score').textContent=score;reset()}function reset(){running=false;commands=[];pos={x:0,y:0};goal=level===3?{x:4,y:4}:{x:(round*2+4)%5,y:(round*3+4)%5};if(key(goal)==='0,0')goal={x:4,y:4};walls=level===3?[{x:1,y:0},{x:1,y:1},{x:3,y:2},{x:3,y:3}]:[];for(let i=1;i<=3;i++)$('tab'+i).classList.toggle('active',i===level);$('heading').textContent=['','1단계 · 방향키 모험','2단계 · 보물 좌표 찾기','3단계 · 장애물 미로 탈출'][level];$('help').textContent=['','화살표를 눌러 토끼를 한 칸씩 움직여 보세요.','X와 Y를 선택해 보물 위치로 순간이동하세요.','이동 명령을 순서대로 조립하고 실행하세요.'][level];$('relative').hidden=level!==1;$('absolute').hidden=level!==2;$('maze').hidden=level!==3;$('message').textContent='🎁 보물을 찾아보세요!';draw()}function draw(){let b=$('board');b.innerHTML='';for(let y=4;y>=0;y--)for(let x=0;x<5;x++){let c=document.createElement('div');c.className='cell';let wall=walls.some(p=>p.x===x&&p.y===y);if(wall)c.classList.add('obstacle');c.textContent=pos.x===x&&pos.y===y?'🐰':goal.x===x&&goal.y===y?'🎁':wall?'🧱':'';let s=document.createElement('small');s.textContent=x+','+y;c.appendChild(s);b.appendChild(c)}$('position').textContent='('+pos.x+', '+pos.y+')';$('commands').textContent=commands.length?commands.map(c=>c.label).join(' → '):'명령을 선택하세요'}function move(dx,dy){if(running)return;step(dx,dy)}function step(dx,dy){let x=pos.x+dx,y=pos.y+dy;if(x<0||x>4||y<0||y>4){$('message').textContent='🚧 지도 밖으로 나갈 수 없어요!';return false}if(walls.some(p=>p.x===x&&p.y===y)){$('message').textContent='🧱 장애물이 있어요! 다른 길을 찾아보세요.';return false}pos={x,y};draw();if(x===goal.x&&y===goal.y){score+=10;$('score').textContent=score;$('message').textContent='🎉 성공! 보물 발견! +10점';return 'win'}$('message').textContent='좋아요! 다음 위치로 이동해요.';return true}function teleport(){let x=+$('x').value,y=+$('y').value;pos={x,y};draw();if(x===goal.x&&y===goal.y){score+=10;$('score').textContent=score;$('message').textContent='🎉 정확한 좌표! +10점'}else $('message').textContent='아쉬워요! 보물의 좌표를 다시 확인해요.'}function add(dx,dy){if(running)return;commands.push({dx,dy,label:dx===1?'➡️':dx===-1?'⬅️':dy===1?'⬆️':'⬇️'});draw()}function undo(){if(running)return;commands.pop();draw()}function clearCommands(){if(running)return;commands=[];draw()}async function run(){if(running||!commands.length)return;running=true;pos={x:0,y:0};draw();let seq=[...commands];for(let c of seq){await new Promise(r=>setTimeout(r,450));let result=step(c.dx,c.dy);if(result!==true)break}running=false}function next(){round++;reset()}stage(1);</script></body></html>
